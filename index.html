<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Kawal Asap: titik panas dan kabut asap Indonesia</title>
    <meta
      name="description"
      content="Deteksi satelit NASA, kualitas udara, dan angin untuk Indonesia."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kawal Asap" />
    <meta property="og:url" content="https://kawalasap.netlify.app/" />
    <meta property="og:title" content="Kawal Asap: pemantauan titik panas dan kabut asap Indonesia" />
    <meta
      property="og:description"
      content="Deteksi satelit NASA, kualitas udara, dan angin untuk Indonesia."
    />
    <!--
      A real raster, not an SVG: scrapers ignore an SVG og:image. Absolute URL, because a
      relative one is not resolvable by the scraper, and it must change if the domain does.
    -->
    <meta property="og:image" content="https://kawalasap.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kartu Kawal Asap: Kenali titik panasnya, pahami udaranya, dengan peta deteksi titik panas Indonesia."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kawal Asap: pemantauan titik panas dan kabut asap Indonesia" />
    <meta
      name="twitter:description"
      content="Deteksi satelit NASA, kualitas udara, dan angin untuk Indonesia."
    />
    <meta name="twitter:image" content="https://kawalasap.netlify.app/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Visit counts, and nothing else about the reader: GoatCounter records the page and the
      time, with no cookie and nothing that identifies a visitor. The app counts each route
      itself (src/lib/goatcounter.ts), so `no_onload` keeps the first view from being counted
      twice and the counter never sees the query string, which here is view state.
    -->
    <script
      data-goatcounter="https://kawalasap.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
