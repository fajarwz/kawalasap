<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Kawal Asap: titik panas dan kabut asap Indonesia</title>
    <meta
      name="description"
      content="Free public dashboard for Indonesia: satellite fire hotspots from NASA FIRMS, model air quality and wind. Every source labelled with its update time and limits."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kawal Asap: pemantauan titik panas dan kabut asap Indonesia" />
    <meta
      property="og:description"
      content="Satellite fire hotspots, air quality and wind across Indonesia, from free public data."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Visit counts, and nothing else about the reader: GoatCounter records the page and the
      time, with no cookie and nothing that identifies a visitor. The app counts each route
      itself (src/lib/goatcounter.ts), so `no_onload` keeps the first view from being counted
      twice and the counter never sees the query string, which here is view state.
    -->
    <script
      data-goatcounter="https://kawalasap.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
