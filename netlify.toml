[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+; 22 matches the functions runtime.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The one server-side piece: NASA FIRMS sends no CORS header, so the browser
# needs this proxy. Netlify's edge caches the response (see the function's
# Cache-Control), so NASA is hit a few times an hour, not once per visitor.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
